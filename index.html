<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Галерея с текстом</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101018;
}

#carouselExample, .carousel-inner, .carousel-item {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* Каждый слайд с фоном */
.carousel-item {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Overlay - лёгкое затемнение */
.carousel-item::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.3);
    z-index: 1;
}

/* Мягкий fade */
.carousel-fade .carousel-item {
    transition: opacity 2s ease-in-out;
}

/* Тексты */
.carousel-text-wrapper {
    position: absolute;
    top: 20%;        /* сдвиг выше */
    left: 15%;       /* отступ от левого края 15% */
    width: 50%;      /* левая половина экрана */
    z-index: 2;
    color: #ffffff;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.5);
}

.carousel-text-wrapper h1 {
    font-size: 3em; /* основной текст */
    margin: 0 0 10px 0;
}

.carousel-text-wrapper p {
    font-size: 1.5em; /* второй текст */
    margin: 0;
}

/* Индикаторы полоски */
.carousel-indicators {
    bottom: 20px;
}

.carousel-indicators button {
    width: 40px;
    height: 6px;
    border-radius: 3px;
    background-color: rgba(255, 255, 255, 0.5);
    margin: 0 5px;
    transition: background-color 0.3s;
}

.carousel-indicators button.active {
    background-color: #ffffff;
}
</style>
</head>
<body>

<div id="carouselExample" class="carousel slide carousel-fade" data-bs-ride="carousel">
  <div class="carousel-indicators" id="carousel-indicators"></div>
  <div class="carousel-inner" id="carousel-inner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const user = 'programmer4cat';
const repo = 'my-webdisplays-site';
const folder = 'images';

// Получаем список изображений из GitHub
fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`)
  .then(response => response.json())
  .then(files => {
    const carouselInner = document.getElementById('carousel-inner');
    const indicators = document.getElementById('carousel-indicators');

    files.forEach((file, index) => {
      if(file.type !== 'file') return;

      // Создаём слайд
      const slide = document.createElement('div');
      slide.className = 'carousel-item' + (index === 0 ? ' active' : '');
      slide.style.backgroundImage = `url(${file.download_url})`;

      // Создаём блок текстов
      const textWrapper = document.createElement('div');
      textWrapper.className = 'carousel-text-wrapper';

      const mainText = document.createElement('h1');
      mainText.textContent = `Фото ${index + 1}`; // основной текст

      const subText = document.createElement('p');
      subText.textContent = `Подпись или описание`; // второй текст

      textWrapper.appendChild(mainText);
      textWrapper.appendChild(subText);
      slide.appendChild(textWrapper);

      carouselInner.appendChild(slide);

      // Создаём индикатор
      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('data-bs-target', '#carouselExample');
      button.setAttribute('data-bs-slide-to', index);
      if(index === 0) button.className = 'active';
      indicators.appendChild(button);
    });

    // Инициализация карусели
    const myCarousel = document.querySelector('#carouselExample');
    new bootstrap.Carousel(myCarousel, {
      interval: 15000, // 15 секунд
      ride: 'carousel'
    });
  })
  .catch(err => console.error('Ошибка загрузки изображений:', err));
</script>

</body>
</html>
