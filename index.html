<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Онлайн-кинотеатр KINOMURR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Подключаем шрифт Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101018;
}

#carouselExample, .carousel-inner, .carousel-item {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* Каждый слайд с фоном */
.carousel-item {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Overlay - усиленное затемнение */
.carousel-item::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6); /* усиленное затемнение */
    z-index: 1;
}

/* Мягкий fade */
.carousel-fade .carousel-item {
    transition: opacity 2s ease-in-out;
}

/* Тексты */
.carousel-text-wrapper {
    position: absolute;
    top: 25%;              /* отступ сверху */
    left: 15%;             /* отступ от левого края */
    width: 50%;            /* левая половина экрана */
    z-index: 2;
    color: #ffffff;
    font-family: 'Inter', Arial, sans-serif;
    transform: none;
}

.carousel-text-wrapper h1 {
    font-size: 3.3em; 
    margin: 0 0 20px 0; 
    line-height: 1.2;
    font-weight: 600;    /* Medium */
}

.carousel-text-wrapper p {
    font-size: 1.65em; 
    margin: 0;
    color: #afafaf; 
    font-weight: 200;    /* Thin */
}

/* Индикаторы полоски */
.carousel-indicators {
    bottom: 20px;
}

.carousel-indicators button {
    width: 40px;
    height: 6px;
    border-radius: 3px;
    background-color: rgba(255, 255, 255, 0.5);
    margin: 0 5px;
    transition: background-color 0.3s;
}

.carousel-indicators button.active {
    background-color: #ffffff;
}

/* Часы */
#moscow-clock {
    position: absolute;
    top: 20px;
    right: 20px;
    font-family: 'Inter', Arial, sans-serif;
    font-size: 1.5em;
    color: #ffffff;
    background: rgba(0,0,0,0.3);
    padding: 5px 10px;
    border-radius: 5px;
    z-index: 10;
}
</style>
</head>
<body>

<div id="carouselExample" class="carousel slide carousel-fade" data-bs-ride="carousel">
  <div class="carousel-indicators" id="carousel-indicators"></div>
  <div class="carousel-inner" id="carousel-inner"></div>

  <!-- Статический текст для всех слайдов -->
  <div class="carousel-text-wrapper">
    <h1>Онлайн-кинотеатр<br>KINOMURR</h1>
    <p>Тепло и уют словно мы рядом!</p>
  </div>

  <!-- Часы -->
  <div id="moscow-clock"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const user = 'programmer4cat';
const repo = 'my-webdisplays-site';
const folder = 'images';

// Получаем список изображений из GitHub
fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`)
  .then(response => response.json())
  .then(files => {
    const carouselInner = document.getElementById('carousel-inner');
    const indicators = document.getElementById('carousel-indicators');

    files.forEach((file, index) => {
      if(file.type !== 'file') return;

      // Создаём слайд
      const slide = document.createElement('div');
      slide.className = 'carousel-item' + (index === 0 ? ' active' : '');
      slide.style.backgroundImage = `url(${file.download_url})`;

      carouselInner.appendChild(slide);

      // Создаём индикатор
      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('data-bs-target', '#carouselExample');
      button.setAttribute('data-bs-slide-to', index);
      if(index === 0) button.className = 'active';
      indicators.appendChild(button);
    });

    // Инициализация карусели
    const myCarousel = document.querySelector('#carouselExample');
    new bootstrap.Carousel(myCarousel, {
      interval: 15000, // 15 секунд
      ride: 'carousel'
    });
  })
  .catch(err => console.error('Ошибка загрузки изображений:', err));

// Функция часов по Москве
function updateMoscowTime() {
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const moscowTime = new Date(utc + (3 * 3600000)); // UTC+3

    let hours = moscowTime.getHours();
    let minutes = moscowTime.getMinutes();
    if (hours < 10) hours = '0' + hours;
    if (minutes < 10) minutes = '0' + minutes;

    document.getElementById('moscow-clock').innerText = `${hours}:${minutes}`;
}

// Обновляем каждую секунду
setInterval(updateMoscowTime, 1000);
updateMoscowTime();
</script>

</body>
</html>
