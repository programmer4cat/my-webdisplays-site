<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Minecraft-кинотеатр KINOMURR</title>
<link rel="icon" type="image/png" href="favicon-512.png">
    
<!-- Запрет индексации -->
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="googlebot-news" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<meta name="msnbot" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<meta name="duckduckbot" content="noindex, nofollow">
<meta name="sogou" content="noindex, nofollow">
<meta name="naverbot" content="noindex, nofollow">
<meta name="yeti" content="noindex, nofollow">

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet"
>

<style>
html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #101018;

    font-family: 'Inter', Arial, sans-serif;
}

#carouselExample,
.carousel-inner,
.carousel-item {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* =========================================================
   ОСНОВНАЯ ГАЛЕРЕЯ
========================================================= */

.carousel-item {
    overflow: hidden;
}

/* ФОН-КАРТИНКА */
.carousel-bg {
    position: absolute;
    inset: 0;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    opacity: 0;

    filter: blur(14px);

    transform: scale(1.04);

    transition:
        opacity 1.5s ease,
        filter 1.7s ease,
        transform 2.5s ease;
}

/* ПОСЛЕ ЗАГРУЗКИ */
.carousel-bg.loaded {
    opacity: 1;

    filter: blur(0);

    transform: scale(1);
}

/* ТЁМНОЕ ЗАТЕМНЕНИЕ */
.carousel-item::before {
    content: "";

    position: absolute;
    inset: 0;

    background: rgba(0,0,0,0.7);

    z-index: 1;
}

/* BOOTSTRAP FADE */
.carousel-fade .carousel-item {
    transition: opacity 1.8s ease-in-out;
}

/* =========================================================
   ТЕКСТ
========================================================= */

.carousel-text-wrapper {
    position: absolute;

    top: 25%;
    left: 15%;

    width: 50%;

    z-index: 5;

    color: #ffffff;
}

.carousel-text-wrapper h1 {
    font-size: 3.3em;

    margin: 0 0 20px 0;

    line-height: 1.2;

    font-weight: 600;
}

.carousel-text-wrapper p {
    font-size: 1.65em;

    margin: 0 0 20px 0;

    color: #afafaf;

    font-weight: 200;
}

/* =========================================================
   КНОПКА
========================================================= */

.my-btn {
    display: inline-block;

    padding: 18px 36px;

    background-color: #ff5136;
    color: #ffffff;

    text-decoration: none;

    font-size: 1.2rem;
    font-weight: 600;

    border-radius: 10px;

    margin-top: 10px;

    transition:
        background-color 0.3s ease,
        transform 0.3s ease,
        box-shadow 0.3s ease;
}

.my-btn:hover {
    background-color: #e0492e;

    transform: translateY(-2px);

    box-shadow:
        0 10px 30px rgba(255,81,54,0.35);
}

/* =========================================================
   ИНДИКАТОРЫ
========================================================= */

.carousel-indicators {
    bottom: 20px;
}

.carousel-indicators button {
    width: 40px;
    height: 6px;

    border-radius: 3px;

    background-color: rgba(255,255,255,0.45);

    margin: 0 5px;

    transition:
        background-color 0.3s ease,
        transform 0.3s ease;
}

.carousel-indicators button.active {
    background-color: #ffffff;

    transform: scaleX(1.2);
}

/* =========================================================
   ЧАСЫ
========================================================= */

#moscow-clock {
    position: absolute;

    bottom: 30px;
    right: 30px;

    font-family: 'Orbitron', sans-serif;

    font-size: 1.5em;

    color: #afafaf;

    z-index: 10;
}

/* =========================================================
   МИНИ-ГАЛЕРЕЯ
========================================================= */

#mini-gallery {
    position: absolute;

    top: 40%;
    right: 10%;

    transform: translateY(-50%);

    max-width: 600px;

    display: flex;

    justify-content: flex-start;

    gap: 12px;

    opacity: 0;

    transition: opacity 1s ease;

    z-index: 5;
}

#mini-gallery .mg-item {
    width: 30%;

    aspect-ratio: 9 / 16;

    overflow: hidden;

    position: relative;

    border-radius: 15px;

    box-shadow:
        0 15px 40px rgba(0,0,0,0.5);

    background:
        rgba(255,255,255,0.05);
}

#mini-gallery .mg-item img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    opacity: 0;

    transform: scale(1.03);

    transition:
        opacity 1s ease,
        transform 2s ease;
}

#mini-gallery .mg-item img.loaded {
    opacity: 1;

    transform: scale(1);
}
</style>
</head>

<body>

<div
    id="carouselExample"
    class="carousel slide carousel-fade"
>

    <div
        class="carousel-indicators"
        id="carousel-indicators"
    ></div>

    <div
        class="carousel-inner"
        id="carousel-inner"
    ></div>

    <!-- ТЕКСТ -->
    <div class="carousel-text-wrapper">

        <h1>
            Minecraft-кинотеатр<br>
            KINOMURR
        </h1>

        <p>
            Тепло и уют словно мы рядом!
        </p>

        <a href="#" class="my-btn">
            Искать приключения!
        </a>
    </div>

    <!-- ЧАСЫ -->
    <div id="moscow-clock"></div>
</div>

<!-- МИНИ-ГАЛЕРЕЯ -->
<div id="mini-gallery">

    <div class="mg-item">
        <img src="" alt="">
    </div>

    <div class="mg-item">
        <img src="" alt="">
    </div>

    <div class="mg-item">
        <img src="" alt="">
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* =========================================================
   ОСНОВНАЯ ГАЛЕРЕЯ
========================================================= */

const user = 'programmer4cat';
const repo = 'my-webdisplays-site';
const folder = 'background-gallery';

fetch(
    `https://api.github.com/repos/${user}/${repo}/contents/${folder}`
)
.then(r => r.json())
.then(files => {

    const carouselInner =
        document.getElementById('carousel-inner');

    const indicators =
        document.getElementById('carousel-indicators');

    /* только файлы */
    files = files.filter(
        file => file.type === 'file'
    );

    /* перемешивание */
    for (let i = files.length - 1; i > 0; i--) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [files[i], files[j]] =
            [files[j], files[i]];
    }

    let carouselStarted = false;

    files.forEach((file, index) => {

        /* СЛАЙД */
        const slide =
            document.createElement('div');

        slide.className =
            'carousel-item' +
            (index === 0 ? ' active' : '');

        /* ФОНОВЫЙ СЛОЙ */
        const bg =
            document.createElement('div');

        bg.className = 'carousel-bg';

        slide.appendChild(bg);

        carouselInner.appendChild(slide);

        /* PRELOAD */
        const img = new Image();

        img.onload = () => {

            bg.style.backgroundImage =
                `url(${file.download_url})`;

            requestAnimationFrame(() => {

                bg.classList.add('loaded');

            });

            /* ИНДИКАТОР */
            const btn =
                document.createElement('button');

            btn.type = 'button';

            btn.setAttribute(
                'data-bs-target',
                '#carouselExample'
            );

            btn.setAttribute(
                'data-bs-slide-to',
                index
            );

            if (index === 0) {
                btn.className = 'active';
            }

            indicators.appendChild(btn);

            /* запуск carousel */
            if (!carouselStarted && index === 0) {

                carouselStarted = true;

                const myCarousel =
                    document.querySelector(
                        '#carouselExample'
                    );

                new bootstrap.Carousel(
                    myCarousel,
                    {
                        interval: 30000,
                        ride: 'carousel'
                    }
                );
            }
        };

        img.src = file.download_url;
    });
})
.catch(err => {

    console.error(
        'Ошибка загрузки изображений:',
        err
    );
});

/* =========================================================
   МИНИ-ГАЛЕРЕЯ
========================================================= */

const MG_USER = 'programmer4cat';
const MG_REPO = 'my-webdisplays-site';
const MG_FOLDER = 'mini-gallery';

const cycleInterval = 15000;

fetch(
    `https://api.github.com/repos/${MG_USER}/${MG_REPO}/contents/${MG_FOLDER}`
)
.then(r => r.json())
.then(files => {

    const images = files
        .filter(f => f.type === 'file')
        .map(f => f.download_url);

    if (images.length < 3) return;

    let pool = [...images];

    const chosen = [];

    for (let i = 0; i < 3; i++) {

        const idx =
            Math.floor(
                Math.random() * pool.length
            );

        chosen.push(pool[idx]);

        pool.splice(idx, 1);
    }

    const imgs =
        document.querySelectorAll(
            '#mini-gallery .mg-item img'
        );

    imgs.forEach((img, i) => {

        const preload = new Image();

        preload.onload = () => {

            img.src = chosen[i];

            requestAnimationFrame(() => {

                img.classList.add('loaded');

            });
        };

        preload.src = chosen[i];
    });

    setTimeout(() => {

        document.getElementById(
            'mini-gallery'
        ).style.opacity = 1;

    }, 500);

    function fadeSwap(imgElement, newUrl) {

        const tmp = new Image();

        tmp.onload = () => {

            imgElement.style.opacity = 0;

            setTimeout(() => {

                imgElement.src = newUrl;

                requestAnimationFrame(() => {

                    imgElement.style.opacity = 1;

                });

            }, 900);
        };

        tmp.src = newUrl;
    }

    function getRandomImage() {

        if (pool.length === 0) {
            pool = [...images];
        }

        const idx =
            Math.floor(
                Math.random() * pool.length
            );

        const img = pool[idx];

        pool.splice(idx, 1);

        return img;
    }

    function cycleChange() {

        fadeSwap(
            imgs[0],
            getRandomImage()
        );

        setTimeout(() => {

            fadeSwap(
                imgs[1],
                getRandomImage()
            );

        }, 600);

        setTimeout(() => {

            fadeSwap(
                imgs[2],
                getRandomImage()
            );

        }, 1200);
    }

    setTimeout(() => {

        cycleChange();

        setInterval(
            cycleChange,
            cycleInterval + 2000
        );

    }, cycleInterval);
})
.catch(err => {

    console.error(
        'Ошибка мини-галереи:',
        err
    );
});

/* =========================================================
   ЧАСЫ
========================================================= */

function updateMoscowTime() {

    const now = new Date();

    const utc =
        now.getTime() +
        now.getTimezoneOffset() * 60000;

    const moscowTime =
        new Date(utc + 3 * 3600000);

    const days = [
        "ВОСКРЕСЕНЬЕ",
        "ПОНЕДЕЛЬНИК",
        "ВТОРНИК",
        "СРЕДА",
        "ЧЕТВЕРГ",
        "ПЯТНИЦА",
        "СУББОТА"
    ];

    const dayName =
        days[moscowTime.getDay()];

    const hours =
        moscowTime
            .getHours()
            .toString()
            .padStart(2, '0');

    const minutes =
        moscowTime
            .getMinutes()
            .toString()
            .padStart(2, '0');

    document.getElementById(
        'moscow-clock'
    ).innerText =
        `${dayName}    ${hours}:${minutes}`;
}

updateMoscowTime();

setInterval(
    updateMoscowTime,
    60000
);
</script>

</body>
</html>
