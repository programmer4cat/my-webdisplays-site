<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Галерея</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: #101018;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

/* Важная правка: позиции и размеры слайдов для fade */
.carousel-item {
    position: absolute; /* делаем абсолютное позиционирование */
    top: 0;
    left: 0;
    width: 100%;
    transition: opacity 1s ease-in-out;
    opacity: 0;
}

.carousel-item.active {
    position: relative; /* активный слайд занимает место */
    opacity: 1;
    z-index: 2;
}

.carousel-inner {
    position: relative;
    width: 100%;
    max-width: 80vw; /* ограничиваем ширину */
    height: 80vh;    /* фиксированная высота */
    overflow: hidden;
}

.carousel-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>
</head>
<body>

<div id="carouselExample" class="carousel slide carousel-fade" data-bs-ride="carousel">
  <div class="carousel-indicators" id="carousel-indicators"></div>
  <div class="carousel-inner" id="carousel-inner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const user = 'programmer4cat';
const repo = 'my-webdisplays-site';
const folder = 'images';

fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`)
  .then(response => response.json())
  .then(files => {
    const carouselInner = document.getElementById('carousel-inner');
    const indicators = document.getElementById('carousel-indicators');

    files.forEach((file, index) => {
      if(file.type !== 'file') return;

      const slide = document.createElement('div');
      slide.className = 'carousel-item' + (index === 0 ? ' active' : '');
      const img = document.createElement('img');
      img.src = file.download_url;
      img.alt = file.name;
      slide.appendChild(img);
      carouselInner.appendChild(slide);

      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('data-bs-target', '#carouselExample');
      button.setAttribute('data-bs-slide-to', index);
      if(index === 0) button.className = 'active';
      indicators.appendChild(button);
    });

    const myCarousel = document.querySelector('#carouselExample');
    new bootstrap.Carousel(myCarousel, {
      interval: 15000,
      ride: 'carousel'
    });
  })
  .catch(err => console.error('Ошибка загрузки изображений:', err));
</script>

</body>
</html>
