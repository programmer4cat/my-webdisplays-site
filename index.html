<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Онлайн-кинотеатр KINOMURR</title>
<!-- Запрет индексации -->
<meta name="robots" content="noindex, nofollow">
<meta name="googlebot" content="noindex, nofollow">
<meta name="googlebot-news" content="noindex, nofollow">
<meta name="bingbot" content="noindex, nofollow">
<meta name="msnbot" content="noindex, nofollow">
<meta name="yandex" content="noindex, nofollow">
<meta name="duckduckbot" content="noindex, nofollow">
<meta name="baiduspider" content="noindex, nofollow">
<meta name="sogou" content="noindex, nofollow">
<meta name="naverbot" content="noindex, nofollow">
<meta name="yeti" content="noindex, nofollow">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
<!-- Подключаем шрифт Inter для текста и Orbitron для часов -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101018;
}

#carouselExample, .carousel-inner, .carousel-item {
    width: 100vw;
    height: 100vh;
    position: relative;
}

/* Каждый слайд с фоном */
.carousel-item {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Overlay - усиленное затемнение */
.carousel-item::before {
    content: "";
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    z-index: 1;
}

/* Мягкий fade */
.carousel-fade .carousel-item {
    transition: opacity 2s ease-in-out;
}

/* Тексты */
.carousel-text-wrapper {
    position: absolute;
    top: 25%;
    left: 15%;
    width: 50%;
    z-index: 2;
    color: #ffffff;
    font-family: 'Inter', Arial, sans-serif;
    transform: none;
}

.carousel-text-wrapper h1 {
    font-size: 3.3em; 
    margin: 0 0 20px 0; 
    line-height: 1.2;
    font-weight: 600;
}

.carousel-text-wrapper p {
    font-size: 1.65em; 
    margin: 0;
    color: #afafaf; 
    font-weight: 200;
}

/* Индикаторы полоски */
.carousel-indicators {
    bottom: 20px;
}

.carousel-indicators button {
    width: 40px;
    height: 6px;
    border-radius: 3px;
    background-color: rgba(255, 255, 255, 0.5);
    margin: 0 5px;
    transition: background-color 0.3s;
}

.carousel-indicators button.active {
    background-color: #ffffff;
}

/* Часы */
#moscow-clock {
    position: absolute;
    bottom: 30px;
    right: 30px;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.5em;
    color: #afafaf;
    z-index: 10;
}

/* ---------------------- */
/* МИНИ-ГАЛЕРЕЯ 9:16 */
/* ---------------------- */

#mini-gallery {
    position: absolute;
    top: 40%;              /* вертикальный центр экрана */
    right: 10%;            /* отступ от правого края 10% ширины окна */
    transform: translateY(-50%);  /* смещение вверх на половину высоты, чтобы центрировать по вертикали */
    max-width: 600px;
    display: flex;
    justify-content: space-between;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 5;
}



#mini-gallery .mg-item {
    width: 31%;              
    aspect-ratio: 9 / 16;  /* вертикальные блоки */
    overflow: hidden;
    position: relative;
    
    border-radius: 15px;   
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
    background: rgba(255, 255, 255, 0.05);
}

#mini-gallery .mg-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;    
    transition: opacity 0.9s ease;
}


</style>
</head>

<body>

<div id="carouselExample" class="carousel slide carousel-fade">
  <div class="carousel-indicators" id="carousel-indicators"></div>
  <div class="carousel-inner" id="carousel-inner"></div>

  <!-- Статический текст для всех слайдов -->
  <div class="carousel-text-wrapper">
    <h1>Онлайн-кинотеатр<br>KINOMURR</h1>
    <p>Тепло и уют словно мы рядом!</p>
  </div>

  <!-- Часы -->
  <div id="moscow-clock"></div>
</div>


<!-- ---------------------------- -->
<!--     МИНИ-ГАЛЕРЕЯ 9:16        -->
<!-- ---------------------------- -->
<div id="mini-gallery">
    <div class="mg-item"><img src="" alt=""></div>
    <div class="mg-item"><img src="" alt=""></div>
    <div class="mg-item"><img src="" alt=""></div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>

/* ------------------------ */
/* Основная галерея слайдов */
/* ------------------------ */
    
const user = 'programmer4cat';
const repo = 'my-webdisplays-site';
const folder = 'background-gallery';

fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`)
  .then(response => response.json())
  .then(files => {
    const carouselInner = document.getElementById('carousel-inner');
    const indicators = document.getElementById('carousel-indicators');

    files.forEach((file, index) => {
      if(file.type !== 'file') return;

      const slide = document.createElement('div');
      slide.className = 'carousel-item' + (index === 0 ? ' active' : '');
      slide.style.backgroundImage = `url(${file.download_url})`;
      carouselInner.appendChild(slide);

      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('data-bs-target', '#carouselExample');
      button.setAttribute('data-bs-slide-to', index);
      if(index === 0) button.className = 'active';
      indicators.appendChild(button);
    });

    const myCarousel = document.querySelector('#carouselExample');
    new bootstrap.Carousel(myCarousel, {
      interval: 30000,
      ride: 'carousel'
    });
  })
  .catch(err => console.error('Ошибка загрузки изображений:', err));


/* ------------------------ */
/* МИНИ-ГАЛЕРЕЯ 9:16        */
/* ------------------------ */

const MG_USER = "programmer4cat";
const MG_REPO = "my-webdisplays-site";
const MG_FOLDER = "mini-gallery";

// Интервал между стартами циклов смены (всего 3 окна с паузами)
const cycleInterval = 10000; // 10 секунд

fetch(`https://api.github.com/repos/${MG_USER}/${MG_REPO}/contents/${MG_FOLDER}`)
    .then(r => r.json())
    .then(files => {
        const images = files
            .filter(f => f.type === "file")
            .map(f => f.download_url);

        if (images.length < 3) return;

        let pool = [...images];

        // выбираем три разных стартовых изображения
        const chosen = [];
        for (let i = 0; i < 3; i++) {
            const index = Math.floor(Math.random() * pool.length);
            chosen.push(pool[index]);
            pool.splice(index, 1);
        }

        const imgs = document.querySelectorAll("#mini-gallery .mg-item img");

        // показываем стартовые изображения
        imgs.forEach((img, i) => {
            img.src = chosen[i];
            setTimeout(() => img.style.opacity = 1, 100);
        });

        // плавное появление всей мини-галереи
        setTimeout(() => {
            document.getElementById("mini-gallery").style.opacity = 1;
        }, 500);

        // плавное переключение картинки
            function fadeSwap(imgElement, newUrl) {
            // Загружаем новое изображение заранее
            const tmp = new Image();
            tmp.src = newUrl;
            tmp.onload = () => {
            // Плавное затухание старого
            imgElement.style.transition = "opacity 0.9s ease";
            imgElement.style.opacity = 0;
            
            setTimeout(() => {
            // Меняем src на уже загруженное
            imgElement.src = newUrl;
            imgElement.style.opacity = 1;
        }, 900); // соответствует времени transition
    };
}


        // Получаем случайное фото из пула, обновляем пул, восстанавливаем если пуст
        function getRandomImage() {
            if (pool.length === 0) pool = [...images];
            const idx = Math.floor(Math.random() * pool.length);
            const img = pool[idx];
            pool.splice(idx, 1);
            return img;
        }

        // Функция смены всех трёх окон последовательно с задержкой 1 сек
        function cycleChange() {
            fadeSwap(imgs[0], getRandomImage());

            setTimeout(() => {
                fadeSwap(imgs[1], getRandomImage());
            }, 1000);

            setTimeout(() => {
                fadeSwap(imgs[2], getRandomImage());
            }, 2000);
        }

        // НЕ запускаем смену сразу,
        // а ждём интервал, и только потом первый цикл
        setTimeout(() => {
            cycleChange();

            // Запускаем циклы с интервалом после первого запуска
            setInterval(cycleChange, cycleInterval + 2000);
        }, cycleInterval);
    })
    .catch(err => console.error("Ошибка мини-галереи:", err));




/* ------------------------ */
/* Часы Москвы              */
/* ------------------------ */

function updateMoscowTime() {
    const now = new Date();
    const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
    const moscowTime = new Date(utc + (3 * 3600000));

    const days = [
        "ВОСКРЕСЕНЬЕ",
        "ПОНЕДЕЛЬНИК",
        "ВТОРНИК",
        "СРЕДА",
        "ЧЕТВЕРГ",
        "ПЯТНИЦА",
        "СУББОТА"
    ];

    const dayName = days[moscowTime.getDay()];
    let hours = moscowTime.getHours().toString().padStart(2, "0");
    let minutes = moscowTime.getMinutes().toString().padStart(2, "0");

    document.getElementById("moscow-clock").innerText =
        `${dayName}\u00A0\u00A0\u00A0\u00A0${hours}:${minutes}`;
}

updateMoscowTime();
setInterval(updateMoscowTime, 60000);
</script>

</body>
</html>
