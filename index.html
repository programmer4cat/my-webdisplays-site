<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Галерея</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101018;
}

#carouselExample, .carousel-inner, .carousel-item {
    width: 100vw;
    height: 100vh;
}

.carousel-item {
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    position: absolute;
    top: 0;
    left: 0;
    transition: opacity 1.5s ease-in-out;
}

/* активный слайд */
.carousel-item.active {
    opacity: 1;
    position: relative;
}

/* Индикаторы-полоски */
.carousel-indicators {
    bottom: 20px;
}

.carousel-indicators button {
    width: 40px;
    height: 6px;
    border-radius: 3px;
    background-color: rgba(255, 255, 255, 0.5);
    margin: 0 5px;
    transition: background-color 0.3s;
}

.carousel-indicators button.active {
    background-color: #ffffff;
}
</style>
</head>
<body>

<div id="carouselExample" class="carousel">
  <div class="carousel-indicators" id="carousel-indicators"></div>
  <div class="carousel-inner" id="carousel-inner"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const user = 'programmer4cat';
const repo = 'my-webdisplays-site';
const folder = 'images';

fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`)
  .then(response => response.json())
  .then(files => {
    const carouselInner = document.getElementById('carousel-inner');
    const indicators = document.getElementById('carousel-indicators');

    files.forEach((file, index) => {
      if(file.type !== 'file') return;

      // Слайд
      const slide = document.createElement('div');
      slide.className = 'carousel-item' + (index === 0 ? ' active' : '');
      slide.style.backgroundImage = `url(${file.download_url})`;
      carouselInner.appendChild(slide);

      // Индикатор
      const button = document.createElement('button');
      button.type = 'button';
      button.addEventListener('click', () => goToSlide(index));
      if(index === 0) button.className = 'active';
      indicators.appendChild(button);
    });

    const slides = carouselInner.querySelectorAll('.carousel-item');
    const dots = indicators.querySelectorAll('button');
    let currentIndex = 0;
    const interval = 15000; // 15 секунд
    const fadeDuration = 1500; // 1.5 секунды
    const delayNext = 300; // задержка между fade out и fade in

    function showNext() {
      const current = slides[currentIndex];
      const nextIndex = (currentIndex + 1) % slides.length;
      const next = slides[nextIndex];

      // Снимаем active с текущего и ставим его для следующего с небольшой задержкой
      current.classList.remove('active');
      setTimeout(() => {
        next.classList.add('active');
      }, delayNext);

      currentIndex = nextIndex;
      updateDots();
    }

    function goToSlide(index) {
      if(index === currentIndex) return;
      slides[currentIndex].classList.remove('active');
      slides[index].classList.add('active');
      currentIndex = index;
      updateDots();
    }

    function updateDots() {
      dots.forEach((dot, i) => {
        dot.classList.toggle('active', i === currentIndex);
      });
    }

    setInterval(showNext, interval);
  })
  .catch(err => console.error('Ошибка загрузки изображений:', err));
</script>

</body>
</html>
