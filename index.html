<title>Галерея</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
    background: #101018;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

/* Важная правка: позиции и размеры слайдов для fade */
.carousel-item {
    position: absolute; /* делаем абсолютное позиционирование */
    top: 0;
    left: 0;
    width: 100%;
    transition: opacity 1s ease-in-out;
    opacity: 0;
}

.carousel-item.active {
    position: relative; /* активный слайд занимает место */
    opacity: 1;
    z-index: 2;
}

.carousel-inner {
    position: relative;
    width: 100%;
    max-width: 80vw; /* ограничиваем ширину */
    height: 80vh;    /* фиксированная высота */
    overflow: hidden;
}

.carousel-item img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
</style>
</head>
<body>

<div id="carouselExample" class="carousel slide carousel-fade" data-bs-ride="carousel">
  <div class="carousel-indicators" id="carousel-indicators"></div>
  <div class="carousel-inner" id="carousel-inner"></div>
</div>
