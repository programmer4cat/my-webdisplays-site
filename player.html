<!doctype html>
<html lang="ru">

<head>

  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Yandex Video Player</title>
  <link rel="preload" href="logo.webp" as="image" />
  <link rel="preload" href="playicon.webp" as="image" />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-family: Arial, sans-serif;
      padding: 24px;
      background: #0f1116;
      background: -webkit-linear-gradient(90deg, #0f1116, #1a1b22);
      background: linear-gradient(90deg, #0f1116, #1a1b22);
    }

    .player-wrap {
      width: min(980px, 96vw);
    }

    .player {
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
      position: relative;
      max-height: 90vh;
      margin: 0 auto;
      transition: max-width 0.3s ease;
    }

    /* FULLSCREEN */
    .player:fullscreen,
    .player:-webkit-full-screen {
      background: #000;
      border-radius: 0;
      border: none;
      justify-content: center;
      aspect-ratio: auto !important;
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .player:fullscreen .video-wrap,
    .player:-webkit-full-screen .video-wrap {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      aspect-ratio: auto !important;
    }

    /* DIMMING OVERLAY FOR CONTINUE BTN */
    .video-wrap.dimmed::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: 90;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }

    /* VIDEO AREA */
    .video-wrap {
      position: relative;
      background: black;
      cursor: pointer;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: var(--player-aspect-ratio, 16 / 9);
      width: 100%;
      max-height: 85vh;
      overflow: hidden;
      transition: aspect-ratio 0.3s ease;
    }

    video {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      /* Адаптивный режим: растяжение на весь экран без искажения пропорций */
      display: block;
      background: black;
      transition: object-fit 0.2s ease;
    }

    video.fit-contain {
      object-fit: contain !important;
    }

    video.fit-cover {
      object-fit: cover !important;
    }

    video.fit-fill {
      object-fit: fill !important;
    }

    video.fit-scale-down {
      object-fit: scale-down !important;
    }

    .loader {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 5%;
      background: rgba(0, 0, 0, .3);
      z-index: 150;
      font-size: 18px;
      pointer-events: none;
    }

    .hidden {
      display: none !important;
    }

    /* POSTER LAYER */
    .poster-layer {
      position: absolute;
      inset: 0;
      background-color: black;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 15;
      transition: opacity 0.6s ease;
      opacity: 0;
      pointer-events: none;
    }

    .poster-layer.visible {
      opacity: 1;
    }

    /* PLAY OVERLAY */
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 5%;
      pointer-events: none;
      opacity: 0;
      transition: .2s;
      color: #9300ff;
      background: rgba(0, 0, 0, .15);
      z-index: 20;
    }

    .play-overlay svg {
      width: 80px;
      height: 80px;
    }

    .play-overlay.show {
      opacity: 1;
    }

    /* VIDEO CONTROLS */
    .video-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      z-index: 110;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.5) 70%, transparent 100%);
      padding: 30px 0 0 0;
      /* Reduced top padding as requested */
      opacity: 1;
      transition: opacity .3s;
    }

    .video-controls.hidden-ui {
      opacity: 0;
      pointer-events: none;
    }

    .video-title {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 25px 25px 80px 25px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
      font-size: 24px;
      font-weight: bold;
      color: white;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      z-index: 95;
      transition: opacity 0.8s ease;
      pointer-events: none;
      opacity: 1;
    }

    .video-title.hidden-ui {
      opacity: 0;
    }

    .progress-wrapper {
      padding: 0 15px;
      margin-bottom: 5px;
    }

    .progress-container {
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      position: relative;
      transition: height 0.1s;
    }

    .progress-container:hover {
      height: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #9300ff;
    }

    .controls-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 15px 15px 15px;
    }

    .left-controls,
    .right-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .seek-group {
      display: flex;
      gap: 2px;
      margin-right: 5px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: white;
      font-size: 24px;
      padding: 5px;
      cursor: pointer;
      opacity: 0.9;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
    }

    .icon-btn svg {
      width: 30px;
      height: 30px;
    }

    .icon-btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .time-display {
      font-size: 16px;
      color: #eee;
      font-family: monospace;
      margin-left: 10px;
    }

    #volumeSlider {
      width: 100px;
      height: 6px;
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    #volumeSlider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
    }

    #continueBtn {
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(5px);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 20px;
    }

    #continueBtn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(1.05);
    }

    .badge-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s, transform 0.1s;
      user-select: none;
    }

    .badge-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: scale(1.04);
    }

    /* TOAST NOTIFICATION */
    .player-toast {
      position: absolute;
      top: 65px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(15, 17, 22, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      z-index: 125;
      transition: opacity 0.25s ease, transform 0.25s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .player-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* FIT MODE POPUP MENU */
    .menu-popup {
      position: absolute;
      bottom: 56px;
      right: 56px;
      background: rgba(20, 22, 30, 0.95);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 8px 0;
      min-width: 190px;
      box-shadow: 0 14px 35px rgba(0, 0, 0, 0.6);
      z-index: 120;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.15s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-header {
      padding: 6px 14px 8px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #a0a5b5;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 4px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      font-size: 13px;
      color: #e5e7eb;
      cursor: pointer;
      transition: background 0.15s;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }

    .menu-item.active {
      color: #9300ff;
      font-weight: 600;
    }

    .menu-item.active::after {
      content: '✓';
      font-weight: bold;
      color: #9300ff;
    }

    /* INTRO LOGO */
    .intro-logo {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: auto;
      cursor: pointer;
      width: 100%;
      max-width: 100%;
    }

    .intro-logo-img {
      max-width: min(340px, 60%);
      max-height: 140px;
      width: auto;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(147, 0, 255, 0.45)) drop-shadow(0 4px 15px rgba(0, 0, 0, 0.6));
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes logoCycle {
      0% {
        opacity: 0;
      }

      25% {
        opacity: 1;
      }

      75% {
        opacity: 1;
      }

      100% {
        opacity: 0;
      }
    }

    .intro-logo.animate {
      animation: logoCycle 3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* START MENU CONTAINER */
    .start-menu {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    .start-menu.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .big-play-btn {
      background: none;
      border: none;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      filter: drop-shadow(0 0 25px rgba(147, 0, 255, 0.5));
    }

    .big-play-btn:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 35px rgba(147, 0, 255, 0.8));
    }

    .big-play-btn:active {
      transform: scale(1.05);
    }

    .big-play-icon {
      width: 120px;
      height: 120px;
      object-fit: contain;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
  </style>

</head>

<body>

  <div class="player-wrap">
    <div class="player" id="player">

      <div class="video-wrap" id="videoWrap">
        <div class="loader hidden" id="loader">Загружаем...</div>
        <div class="play-overlay" id="playOverlay"></div>
        <div class="player-toast" id="playerToast"></div>
        <div class="poster-layer" id="posterLayer"></div>

        <div id="introLogo" class="intro-logo hidden">
          <img src="logo.webp" alt="Logo" class="intro-logo-img" />
        </div>

        <div id="startMenu" class="start-menu hidden">
          <button id="bigPlayBtn" class="big-play-btn" title="Начать сначала">
            <img src="playicon.webp" alt="Play" class="big-play-icon" />
          </button>
          <button id="continueBtn" class="hidden">Продолжить</button>
        </div>

        <video id="video"></video>
        <audio id="externalAudio"></audio>

        <div class="video-title hidden-ui" id="videoTitle"></div>

        <div class="video-controls" id="videoControls">
          <div class="progress-wrapper">
            <div class="progress-container" id="progressContainer">
              <div class="progress-bar" id="progressBar"></div>
            </div>
          </div>

          <div class="controls-row">
            <div class="left-controls">
              <button id="mainPlayBtn" class="icon-btn" title="Воспроизвести">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                  <path d="M8 5v14l11-7z" />
                </svg>
              </button>

              <div class="seek-group">
                <button id="backBtn" class="icon-btn" title="Назад 10 сек">
                  <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z" />
                  </svg>
                </button>

                <button id="forwardBtn" class="icon-btn" title="Вперед 10 сек">
                  <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z" />
                  </svg>
                </button>
              </div>

              <button id="muteBtn" class="icon-btn" title="Громкость">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path
                    d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
                </svg>
              </button>
              <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1">
              <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
            </div>
            <div class="right-controls">
              <button id="fitModeBtn" class="badge-btn" title="Режим экрана / пропорции (A)">
                <span id="fitModeLabel">Вписать</span>
                <span style="font-size: 10px;">▼</span>
              </button>
              <button id="fullscreenBtn" class="icon-btn" title="Полный экран (F)">⛶</button>
            </div>
          </div>
        </div>

        <!-- Fit Mode Menu Popup -->
        <div id="fitModeMenu" class="menu-popup hidden">
          <div class="menu-header">Режим экрана</div>
          <div class="menu-item active" data-fit="contain">Вписать (Адаптивный)</div>
          <div class="menu-item" data-fit="cover">Заполнить (Без полос)</div>
          <div class="menu-item" data-fit="fill">Растянуть (100%)</div>
          <div class="menu-item" data-fit="scale-down">Оригинал (1:1)</div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const player = document.getElementById('player');
    const videoWrap = document.getElementById('videoWrap');
    const loader = document.getElementById('loader');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const videoControls = document.getElementById('videoControls');
    const mainPlayBtn = document.getElementById('mainPlayBtn');
    const muteBtn = document.getElementById('muteBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const externalAudio = document.getElementById('externalAudio');
    const timeDisplay = document.getElementById('timeDisplay');
    const videoTitle = document.getElementById('videoTitle');
    const playOverlay = document.getElementById('playOverlay');
    const posterLayer = document.getElementById('posterLayer');
    const introLogo = document.getElementById('introLogo');
    const startMenu = document.getElementById('startMenu');
    const bigPlayBtn = document.getElementById('bigPlayBtn');
    const continueBtn = document.getElementById('continueBtn');
    const backBtn = document.getElementById('backBtn');
    const forwardBtn = document.getElementById('forwardBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const fitModeBtn = document.getElementById('fitModeBtn');
    const fitModeLabel = document.getElementById('fitModeLabel');
    const fitModeMenu = document.getElementById('fitModeMenu');
    const playerToast = document.getElementById('playerToast');

    let currentVideoKey = null;
    let uiHideTimeout;
    let hasStartedPlaying = false;
    let menuAlreadyShown = false;
    let introTimeout = null;
    let currentFitMode = localStorage.getItem('player-fit-mode') || 'contain';

    const fitModeLabels = {
      'contain': 'Вписать',
      'cover': 'Заполнить',
      'fill': 'Растянуть',
      'scale-down': 'Оригинал'
    };

    const fitModeToasts = {
      'contain': 'Режим: Вписать (Адаптивный без искажений)',
      'cover': 'Режим: Заполнить (Без полос, с кадрированием)',
      'fill': 'Режим: Растянуть (100% экран)',
      'scale-down': 'Режим: Оригинал (1:1 без масштабирования)'
    };

    function showToast(text) {
      if (!playerToast) return;
      playerToast.textContent = text;
      playerToast.classList.add('show');
      clearTimeout(playerToast.hideTimeout);
      playerToast.hideTimeout = setTimeout(() => playerToast.classList.remove('show'), 1600);
    }

    function setFitMode(mode, showNotification = true) {
      currentFitMode = mode;
      localStorage.setItem('player-fit-mode', mode);
      video.classList.remove('fit-contain', 'fit-cover', 'fit-fill', 'fit-scale-down');
      video.classList.add('fit-' + mode);
      if (fitModeLabel) fitModeLabel.textContent = fitModeLabels[mode] || mode;

      if (fitModeMenu) {
        fitModeMenu.querySelectorAll('.menu-item[data-fit]').forEach(item => {
          if (item.dataset.fit === mode) item.classList.add('active');
          else item.classList.remove('active');
        });
      }

      if (showNotification) {
        showToast(fitModeToasts[mode] || mode);
      }
    }

    function cycleFitMode() {
      const modes = ['contain', 'cover', 'fill', 'scale-down'];
      const nextIndex = (modes.indexOf(currentFitMode) + 1) % modes.length;
      setFitMode(modes[nextIndex], true);
    }

    function updateAspectRatio(width, height) {
      if (width && height) {
        const ratio = width / height;
        videoWrap.style.setProperty('--player-aspect-ratio', `${width} / ${height}`);
        if (!document.fullscreenElement) {
          if (ratio < 0.85) {
            player.style.maxWidth = `min(${Math.round(80 * ratio)}vh, 520px)`;
          } else {
            player.style.maxWidth = '';
          }
        }
      }
    }

    // Initialize fit mode
    setFitMode(currentFitMode, false);

    function showPlayMenu() {
      if (introTimeout) {
        clearTimeout(introTimeout);
        introTimeout = null;
      }
      introLogo.classList.remove('animate');
      introLogo.classList.add('hidden');
      if (!hasStartedPlaying) {
        startMenu.classList.remove('hidden');
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            startMenu.classList.add('visible');
          });
        });
      }
    }

    function showUI() {
      videoControls.classList.remove('hidden-ui');
      videoTitle.classList.remove('hidden-ui');
      clearTimeout(uiHideTimeout);
      uiHideTimeout = setTimeout(() => {
        if (!video.paused && fitModeMenu.classList.contains('hidden')) {
          videoControls.classList.add('hidden-ui');
          videoTitle.classList.add('hidden-ui');
        }
      }, 3000);
    }

    function updateTimeDisplay() {
      const current = formatTime(video.currentTime || 0);
      const total = formatTime(video.duration || 0);
      timeDisplay.textContent = `${current} / ${total}`;
    }

    function formatTime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function updateMuteIcon() {
      const vol = externalAudio.src ? externalAudio.volume : video.volume;
      const isMuted = externalAudio.src ? externalAudio.muted : video.muted;
      if (isMuted || vol === 0) {
        muteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
      } else if (vol < 0.5) {
        muteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>';
      } else {
        muteBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
      }
    }

    muteBtn.onclick = (e) => {
      e.stopPropagation();
      const newState = externalAudio.src ? !externalAudio.muted : !video.muted;
      video.muted = newState;
      externalAudio.muted = newState;
      updateMuteIcon();
    };

    volumeSlider.oninput = (e) => {
      e.stopPropagation();
      const val = volumeSlider.value;
      video.volume = val;
      externalAudio.volume = val;
      updateMuteIcon();
    };

    volumeSlider.onclick = (e) => e.stopPropagation();

    function togglePlay(silent = false) {
      if (video.paused) {
        video.play();
        if (!silent) showOverlay('▶');
      } else {
        video.pause();
        if (!silent) showOverlay('⏸');
      }
      hideMenu();
    }

    function hideMenu() {
      if (introTimeout) {
        clearTimeout(introTimeout);
        introTimeout = null;
      }
      introLogo.classList.remove('animate');
      introLogo.classList.add('hidden');
      startMenu.classList.remove('visible');
      startMenu.classList.add('hidden');
      videoWrap.classList.remove('dimmed');
    }

    function showOverlay(icon) {
      playOverlay.innerHTML = icon === '▶' ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
      playOverlay.classList.add('show');
      clearTimeout(playOverlay.hideTimeout);
      playOverlay.hideTimeout = setTimeout(() => playOverlay.classList.remove('show'), 1000);
    }

    function restoreProgress() {
      if (menuAlreadyShown || hasStartedPlaying) return;
      menuAlreadyShown = true;

      const savedTime = currentVideoKey ? localStorage.getItem(currentVideoKey) : null;
      loader.classList.add('hidden');
      videoWrap.classList.add('dimmed');

      if (savedTime && Number(savedTime) > 10) {
        const displayTime = Math.max(0, Number(savedTime) - 5);
        const seconds = Math.floor(displayTime);
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        const formatted = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        continueBtn.textContent = `Продолжить с ${formatted}`;
        continueBtn.classList.remove('hidden');
      } else {
        continueBtn.classList.add('hidden');
      }

      // Start 3-second logo intro cycle
      introLogo.classList.remove('hidden');
      void introLogo.offsetWidth;
      introLogo.classList.add('animate');

      if (introTimeout) clearTimeout(introTimeout);
      introTimeout = setTimeout(() => {
        showPlayMenu();
      }, 3000);
    }

    introLogo.onclick = (e) => {
      e.stopPropagation();
      showPlayMenu();
    };

    bigPlayBtn.onclick = (e) => { e.stopPropagation(); video.currentTime = 0; togglePlay(true); };
    continueBtn.onclick = (e) => {
      e.stopPropagation();
      const savedTime = localStorage.getItem(currentVideoKey);
      if (savedTime) video.currentTime = Math.max(0, Number(savedTime) - 5);
      togglePlay(true);
    };

    async function loadVideo(publicUrl) {
      try {
        video.pause(); video.src = "";
        hasStartedPlaying = false; menuAlreadyShown = false;

        if (introTimeout) {
          clearTimeout(introTimeout);
          introTimeout = null;
        }
        introLogo.classList.remove('animate');
        introLogo.classList.add('hidden');
        startMenu.classList.remove('visible');
        startMenu.classList.add('hidden');
        continueBtn.classList.add('hidden');
        posterLayer.classList.remove('visible');
        videoWrap.classList.remove('dimmed');
        loader.classList.remove('hidden');
        loader.textContent = 'Загружаем...';

        videoTitle.classList.add('hidden-ui');
        videoTitle.textContent = '';
        currentVideoKey = 'video-progress-' + publicUrl;
        localStorage.setItem('last-video-url', publicUrl);

        const api = 'https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=' + encodeURIComponent(publicUrl);
        const resp = await fetch(api);
        const data = await resp.json();
        if (!data.href) throw new Error();

        // Metadata
        try {
          const mApi = 'https://cloud-api.yandex.net/v1/disk/public/resources?public_key=' + encodeURIComponent(publicUrl) + '&preview_size=1280x720&fields=name,preview';
          const mResp = await fetch(mApi);
          const mData = await mResp.json();
          if (mData.name) {
            videoTitle.textContent = mData.name;
            document.title = mData.name + " - Player";
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                videoTitle.classList.remove('hidden-ui');
              });
            });
            // Show menu as soon as we have metadata
            restoreProgress();
          }
          if (mData.preview) {
            const img = new Image();
            img.onload = () => { posterLayer.style.backgroundImage = `url('${mData.preview}')`; posterLayer.classList.add('visible'); };
            img.src = mData.preview;
          }
        } catch (e) { }

        video.src = data.href;
        const aParam = new URLSearchParams(window.location.search).get('a');
        if (aParam) {
          const aApi = 'https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=' + encodeURIComponent(aParam);
          const aResp = await fetch(aApi);
          const aData = await aResp.json();
          if (aData.href) { externalAudio.src = aData.href; video.muted = true; }
        } else { video.muted = false; }

        updateMuteIcon();
        video.oncanplay = () => restoreProgress();

      } catch (err) { loader.textContent = 'Ошибка загрузки'; }
    }

    mainPlayBtn.onclick = (e) => { e.stopPropagation(); togglePlay(); };
    videoWrap.onclick = () => { togglePlay(); showUI(); };
    videoControls.onclick = (e) => e.stopPropagation();

    video.onplay = () => {
      hasStartedPlaying = true; hideMenu();
      mainPlayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
      posterLayer.classList.remove('visible');
      if (externalAudio.src) { externalAudio.play(); externalAudio.currentTime = video.currentTime; }
      showUI();
    };
    video.onpause = () => {
      mainPlayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
      if (externalAudio.src) externalAudio.pause();
      showUI();
    };
    video.onseeking = () => { if (externalAudio.src) externalAudio.currentTime = video.currentTime; };
    setInterval(() => {
      if (externalAudio.src && !video.paused) {
        const diff = Math.abs(externalAudio.currentTime - video.currentTime);
        if (diff > 0.3) externalAudio.currentTime = video.currentTime;
      }
    }, 1000);
    video.addEventListener('mousemove', showUI);
    backBtn.onclick = (e) => { e.stopPropagation(); video.currentTime -= 10; showOverlay('⏪'); showUI(); };
    forwardBtn.onclick = (e) => { e.stopPropagation(); video.currentTime += 10; showOverlay('⏩'); showUI(); };
    fullscreenBtn.onclick = async (e) => {
      e.stopPropagation();
      if (!document.fullscreenElement) await player.requestFullscreen(); else await document.exitFullscreen();
      showUI();
    };
    video.ontimeupdate = () => {
      if (!video.duration) return;
      progressBar.style.width = (video.currentTime / video.duration * 100) + '%';
      updateTimeDisplay();
    };

    video.onloadedmetadata = () => {
      if (video.videoWidth && video.videoHeight) {
        updateAspectRatio(video.videoWidth, video.videoHeight);
      }
      updateTimeDisplay();
    };

    fitModeBtn.onclick = (e) => {
      e.stopPropagation();
      fitModeMenu.classList.toggle('hidden');
    };

    fitModeMenu.querySelectorAll('.menu-item[data-fit]').forEach(item => {
      item.onclick = (e) => {
        e.stopPropagation();
        setFitMode(item.dataset.fit, true);
        fitModeMenu.classList.add('hidden');
      };
    });

    window.addEventListener('click', () => {
      fitModeMenu.classList.add('hidden');
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        if (video.videoWidth && video.videoHeight) {
          updateAspectRatio(video.videoWidth, video.videoHeight);
        }
      } else {
        player.style.maxWidth = '';
      }
      showUI();
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      switch (e.code) {
        case 'Space':
        case 'KeyK':
          e.preventDefault();
          togglePlay();
          showUI();
          break;
        case 'ArrowLeft':
        case 'KeyJ':
          e.preventDefault();
          video.currentTime = Math.max(0, video.currentTime - 10);
          showOverlay('⏪');
          showUI();
          break;
        case 'ArrowRight':
        case 'KeyL':
          e.preventDefault();
          video.currentTime = Math.min(video.duration || Infinity, video.currentTime + 10);
          showOverlay('⏩');
          showUI();
          break;
        case 'ArrowUp':
          e.preventDefault();
          video.volume = Math.min(1, video.volume + 0.05);
          volumeSlider.value = video.volume;
          updateMuteIcon();
          showUI();
          break;
        case 'ArrowDown':
          e.preventDefault();
          video.volume = Math.max(0, video.volume - 0.05);
          volumeSlider.value = video.volume;
          updateMuteIcon();
          showUI();
          break;
        case 'KeyM':
          e.preventDefault();
          video.muted = !video.muted;
          updateMuteIcon();
          showUI();
          break;
        case 'KeyF':
          e.preventDefault();
          fullscreenBtn.click();
          break;
        case 'KeyA':
          e.preventDefault();
          cycleFitMode();
          showUI();
          break;
      }
    });
    progressContainer.onclick = (e) => {
      e.stopPropagation();
      const rect = progressContainer.getBoundingClientRect();
      video.currentTime = (e.clientX - rect.left) / rect.width * video.duration;
      showUI();
    };
    setInterval(() => { if (!video.paused && video.currentTime > 0) localStorage.setItem(currentVideoKey, video.currentTime); }, 5000);
    window.addEventListener('beforeunload', () => { if (!video.paused) localStorage.setItem(currentVideoKey, video.currentTime); });
    video.onended = () => { localStorage.removeItem(currentVideoKey); mainPlayBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'; showUI(); };

    const p = new URLSearchParams(window.location.search);
    if (p.get('v')) {
      loadVideo(p.get('v'));
    } else if (localStorage.getItem('last-video-url')) {
      loadVideo(localStorage.getItem('last-video-url'));
    } else {
      restoreProgress();
    }
  </script>
</body>

</html>
