<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Спящий котёнок</title>

    <!-- Шрифт Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            /* Фон + затемнение 70% */
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.8),
                    rgba(0, 0, 0, 0.8)
                ),
                url("https://programmer4cat.github.io/my-webdisplays-site/SleepyCat.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            /* Центрирование */
            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            /* Inter */
            font-family: "Inter", sans-serif;
        }

        .poem {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 12px;

            color: white;

            font-size: clamp(28px, 5vw, 56px);
            font-weight: 600;
            line-height: 1.2;

            text-align: center;
        }

        .line {
            color: white;
            transform: scale(1);

            /*
             * Плавное изменение цвета
             * и размера
             */
            transition:
                color 0.8s ease-in-out,
                transform 0.8s ease-in-out;
        }


        /*
         * ========================================
         * 1. Тёплый пушистый
         * ========================================
         */

        .line:nth-child(1) {
            animation: line1 12s infinite;
        }

        @keyframes line1 {

            0% {
                color: white;
                transform: scale(1);
            }

            /* Плавно загорается */
            4% {
                color: #ff5136;
                transform: scale(1.08);
            }

            /* Держим подсветку */
            21% {
                color: #ff5136;
                transform: scale(1.08);
            }

            /* Плавно гаснет */
            25% {
                color: white;
                transform: scale(1);
            }

            100% {
                color: white;
                transform: scale(1);
            }
        }


        /*
         * ========================================
         * 2. ко-о-о-тёнок спит
         * ========================================
         */

        .line:nth-child(2) {
            animation: line2 12s infinite;
        }

        @keyframes line2 {

            0% {
                color: white;
                transform: scale(1);
            }

            25% {
                color: white;
                transform: scale(1);
            }

            /* Плавно загорается */
            29% {
                color: #ff5136;
                transform: scale(1.08);
            }

            /* Держим подсветку */
            46% {
                color: #ff5136;
                transform: scale(1.08);
            }

            /* Плавно гаснет */
            50% {
                color: white;
                transform: scale(1);
            }

            100% {
                color: white;
                transform: scale(1);
            }
        }


        /*
         * ========================================
         * 3. Свернулся клубочком
         * ========================================
         */

        .line:nth-child(3) {
            animation: line3 12s infinite;
        }

        @keyframes line3 {

            0% {
                color: white;
                transform: scale(1);
            }

            50% {
                color: white;
                transform: scale(1);
            }

            /* Плавно загорается */
            54% {
                color: #ff5136;
                transform: scale(1.08);
            }

            /* Держим подсветку */
            71% {
                color: #ff5136;
                transform: scale(1.08);
            }

            /* Плавно гаснет */
            75% {
                color: white;
                transform: scale(1);
            }

            100% {
                color: white;
                transform: scale(1);
            }
        }


        /*
         * ========================================
         * 4. и мур-чит
         * ========================================
         */

        .line:nth-child(4) {
            animation: line4 12s infinite;
        }

        @keyframes line4 {

            0% {
                color: white;
                transform: scale(1);
            }

            75% {
                color: white;
                transform: scale(1);
            }

            /* Плавно загорается */
            79% {
                color: #ff5136;
                transform: scale(1.08);
            }

            /* Держим подсветку */
            96% {
                color: #ff5136;
                transform: scale(1.08);
            }

            /* Плавно гаснет */
            100% {
                color: white;
                transform: scale(1);
            }
        }

    </style>
</head>

<body>

    <div class="poem">
        <div class="line">Тёплый пушистый</div>
        <div class="line">ко-о-о-тёнок спит</div>
        <div class="line">Свернулся клубочком</div>
        <div class="line">и мур-чит</div>
    </div>

</body>
</html>
