<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yandex Player v2.0 - Playlist Edition</title>
  <style>
    :root {
      --accent: #9300ff;
      --bg: #0f1116;
      --panel: rgba(255, 255, 255, 0.05);
      --text: #eee;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: var(--bg);
      background: linear-gradient(90deg, #0f1116, #1a1b22);
      color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      overflow: hidden;
    }

    /* MAIN PLAYER AREA */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #000;
    }

    .video-container {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      max-width: 100%;
      max-height: 100%;
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* PLAYLIST SIDEBAR */
    .sidebar {
      width: 350px;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      transition: width 0.3s;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(147, 0, 255, 0.1);
    }

    .sidebar-header h2 {
      margin: 0;
      font-size: 18px;
      color: var(--accent);
    }

    .playlist {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .playlist::-webkit-scrollbar {
      width: 6px;
    }

    .playlist::-webkit-scrollbar-track {
      background: transparent;
    }

    .playlist::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 3px;
    }

    .playlist-item {
      padding: 12px 15px;
      margin-bottom: 8px;
      background: var(--panel);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .playlist-item:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateX(-5px);
    }

    .playlist-item.active {
      background: rgba(147, 0, 255, 0.2);
      border-color: var(--accent);
    }

    .playlist-item .icon {
      font-size: 20px;
    }

    .playlist-item .info {
      flex: 1;
      overflow: hidden;
    }

    .playlist-item .name {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .playlist-item .meta {
      font-size: 11px;
      color: #888;
    }

    /* OVERLAYS & LOADER */
    .loader {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      font-size: 18px;
    }

    .hidden {
      display: none !important;
    }

    /* TITLE OVERLAY */
    .video-title {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    /* CUSTOM CONTROLS (Minimal) */
    .controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
      z-index: 10;
    }

    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      cursor: pointer;
      margin-bottom: 15px;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
    }

    .btns {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 5px;
      opacity: 0.8;
      transition: 0.2s;
    }

    .btn:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    .btn svg {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    .time {
      font-family: monospace;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        height: 300px;
      }
    }
  </style>
</head>

<body>

  <div class="main-content">
    <div id="loader" class="loader hidden">Загрузка...</div>

    <div class="video-title" id="videoTitle">Выберите видео из плейлиста</div>

    <div class="video-container" id="videoContainer">
      <video id="video" controls></video>
    </div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2 id="folderName">Плейлист</h2>
    </div>
    <div class="playlist" id="playlist">
      <div style="padding: 20px; text-align: center; color: #888;">
        Добавьте ?d=ССЫЛКА_НА_ПАПКУ в URL
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const playlistDiv = document.getElementById('playlist');
    const videoTitle = document.getElementById('videoTitle');
    const folderNameElem = document.getElementById('folderName');
    const loader = document.getElementById('loader');

    let playlistItems = [];
    let currentIndex = -1;

    async function loadPlaylist(folderUrl) {
      loader.classList.remove('hidden');
      try {
        const api = `https://cloud-api.yandex.net/v1/disk/public/resources?public_key=${encodeURIComponent(folderUrl)}&limit=100`;
        const resp = await fetch(api);
        const data = await resp.json();

        if (data.error) throw new Error(data.message);

        folderNameElem.textContent = data.name || 'Плейлист';
        playlistItems = data._embedded.items.filter(item => item.media_type === 'video');

        renderPlaylist();

        // Автоматически запускаем первое видео, если в URL нет v
        const p = new URLSearchParams(window.location.search);
        if (!p.get('v') && playlistItems.length > 0) {
          playVideo(0);
        }
      } catch (e) {
        playlistDiv.innerHTML = `<div style="color:red; padding:20px;">Ошибка: ${e.message}</div>`;
      } finally {
        loader.classList.add('hidden');
      }
    }

    function renderPlaylist() {
      playlistDiv.innerHTML = '';
      playlistItems.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = `playlist-item ${index === currentIndex ? 'active' : ''}`;
        div.onclick = () => playVideo(index);

        const sizeMb = (item.size / (1024 * 1024)).toFixed(1);

        div.innerHTML = `
          <div class="icon">🎬</div>
          <div class="info">
            <div class="name" title="${item.name}">${item.name}</div>
            <div class="meta">${sizeMb} MB</div>
          </div>
        `;
        playlistDiv.appendChild(div);
      });
    }

    async function playVideo(index) {
      if (index < 0 || index >= playlistItems.length) return;

      currentIndex = index;
      const item = playlistItems[index];

      videoTitle.textContent = item.name;
      document.title = item.name;
      renderPlaylist();

      loader.classList.remove('hidden');
      try {
        const api = `https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=${encodeURIComponent(item.public_url || item.public_key)}`;
        const resp = await fetch(api);
        const data = await resp.json();

        if (!data.href) throw new Error();

        video.src = data.href;
        video.play();
      } catch (e) {
        alert('Ошибка загрузки видео');
      } finally {
        loader.classList.add('hidden');
      }
    }

    // Авто-переключение на следующее видео
    video.onended = () => {
      if (currentIndex < playlistItems.length - 1) {
        playVideo(currentIndex + 1);
      }
    };

    // Инициализация из URL
    const params = new URLSearchParams(window.location.search);
    const d = params.get('d');
    const v = params.get('v');

    if (d) {
      loadPlaylist(d);
    } else if (v) {
      // Если передано только видео
      playlistDiv.innerHTML = '<div style="padding:20px; color:#888;">Режим одиночного видео</div>';
      playSingleVideo(v);
    }

    async function playSingleVideo(publicUrl) {
      loader.classList.remove('hidden');
      try {
        const api = `https://cloud-api.yandex.net/v1/disk/public/resources/download?public_key=${encodeURIComponent(publicUrl)}`;
        const resp = await fetch(api);
        const data = await resp.json();
        video.src = data.href;
        video.play();
      } catch (e) { } finally { loader.classList.add('hidden'); }
    }
  </script>
</body>

</html>
